<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>harness-cli Palette Viewer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #111; color: #eee; padding: 2rem; }
h1 { font-size: 1.5rem; margin-bottom: 1rem; color: #9d7cd8; }
.controls { margin-bottom: 2rem; display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
.controls select { padding: 0.4rem 0.8rem; background: #222; color: #eee; border: 1px solid #444; border-radius: 4px; font-size: 0.9rem; }
.controls label { color: #888; font-size: 0.85rem; }
.controls input[type="file"] { font-size: 0.85rem; color: #888; }
.mode-toggle { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
.mode-toggle button { padding: 0.4rem 1rem; background: #222; color: #888; border: 1px solid #444; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
.mode-toggle button.active { background: #9d7cd8; color: #fff; border-color: #9d7cd8; }
.swatch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 0.5rem; margin-bottom: 2rem; }
.category { grid-column: 1 / -1; font-size: 0.8rem; color: #888; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px solid #333; }
.slot { display: flex; align-items: center; gap: 0.75rem; padding: 0.35rem 0.5rem; border-radius: 4px; background: #1a1a1a; }
.slot-name { min-width: 140px; font-size: 0.85rem; color: #ccc; }
.swatch { width: 48px; height: 24px; border-radius: 3px; border: 1px solid rgba(255,255,255,0.1); flex-shrink: 0; }
.hex { font-family: 'SF Mono', 'Consolas', monospace; font-size: 0.8rem; color: #888; }
.hidden { display: none; }
</style>
</head>
<body>

<h1>harness-cli Palette Viewer</h1>

<div class="controls">
  <label>Theme:</label>
  <select id="theme-select"><option value="">(select a theme)</option></select>
  <label>or load custom:</label>
  <input type="file" id="file-input" accept=".json">
</div>

<div class="mode-toggle">
  <button data-mode="dark" class="active">Dark</button>
  <button data-mode="light">Light</button>
  <button data-mode="both">Both</button>
</div>

<div id="palette"></div>

const CATEGORIES = [
  { label: 'Core', keys: ['background', 'text', 'primary', 'accent', 'success', 'warning', 'error', 'info', 'border', 'borderActive', 'textMuted', 'panel', 'element', 'menu'] },
  { label: 'Diff', keys: ['diffAdded', 'diffRemoved', 'diffContext', 'diffHunkHeader', 'diffHighlightAdded', 'diffHighlightRemoved'] },
  { label: 'Syntax', keys: ['syntaxComment', 'syntaxKeyword', 'syntaxString', 'syntaxFunction', 'syntaxVariable', 'syntaxProperty', 'syntaxType', 'syntaxConstant', 'syntaxOperator', 'syntaxPunctuation', 'syntaxObject'] },
  { label: 'Markdown', keys: ['markdownHeading', 'markdownText', 'markdownLink', 'markdownLinkText', 'markdownCode', 'markdownBlockQuote', 'markdownEmph', 'markdownStrong', 'markdownHorizontalRule', 'markdownListItem', 'markdownListEnumeration', 'markdownImage', 'markdownImageText', 'markdownCodeBlock'] },
  { label: 'TUI', keys: ['interactive', 'selectedListItemText'] },
];

function resolveColor(entry, mode) {
  if (!entry) return null;
  if (typeof entry === 'string') return entry;
  if (entry[mode]) return entry[mode];
  return null;
}

function renderPalette(theme, mode) {
  const slots = theme.theme || theme.colors || theme;
  const container = document.getElementById('palette');
  container.innerHTML = '';
  
  let html = '';
  for (const cat of CATEGORIES) {
    const items = cat.keys.filter(k => k in slots);
    if (items.length === 0) continue;
    html += `<div class="category">${cat.label}</div>`;
    for (const key of items) {
      if (mode === 'both') {
        const dark = resolveColor(slots[key], 'dark');
        const light = resolveColor(slots[key], 'light');
        html += `<div class="slot">
          <span class="slot-name">${key}</span>
          <div class="swatch" style="background:${dark || 'transparent'}"></div>
          <span class="hex">${dark || '—'}</span>
          <div class="swatch" style="background:${light || 'transparent'}"></div>
          <span class="hex">${light || '—'}</span>
        </div>`;
      } else {
        const color = resolveColor(slots[key], mode);
        const hex = color || '—';
        const style = color ? `background:${color}` : 'background:transparent;border:1px dashed #444';
        html += `<div class="slot">
          <span class="slot-name">${key}</span>
          <div class="swatch" style="${style}"></div>
          <span class="hex">${hex}</span>
        </div>`;
      }
    }
  }
  container.innerHTML = html;
}

function loadThemeFile(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const theme = JSON.parse(e.target.result);
      renderPalette(theme, getActiveMode());
    } catch (err) {
      alert('Error loading theme: ' + err.message);
    }
  };
  reader.readAsText(file);
}

function loadBundledTheme(name) {
  const theme = EMBEDDED_THEMES[name];
  if (theme) renderPalette(theme, getActiveMode());
}

function getActiveMode() {
  const active = document.querySelector('.mode-toggle .active');
  return active ? active.dataset.mode : 'both';
}

const KNOWN_THEMES = Object.keys(EMBEDDED_THEMES).sort();
const select = document.getElementById('theme-select');
for (const name of KNOWN_THEMES) {
  const opt = document.createElement('option');
  opt.value = name;
  opt.textContent = name;
  select.appendChild(opt);
}

select.addEventListener('change', () => {
  if (select.value) loadBundledTheme(select.value);
});

document.getElementById('file-input').addEventListener('change', (e) => {
  if (e.target.files.length > 0) loadThemeFile(e.target.files[0]);
});

document.querySelectorAll('.mode-toggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-toggle button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const selectVal = document.getElementById('theme-select').value;
    if (selectVal) loadBundledTheme(selectVal);
  });
});

// Load default theme
loadBundledTheme('opencode');
</script>
