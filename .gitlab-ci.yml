image: node:22

stages:
  - publish

# --- Build and publish CLI to npm ---
publish-npm:
  stage: publish
  script:
    - npm ci
    - npm run build
    - cd packages/harness-cli && npm run bundle
    - node -e "
        const p = require('./package.json');
        for (const k of Object.keys(p.dependencies || {})) {
          if (k.startsWith('@harness/')) delete p.dependencies[k];
        }
        require('fs').writeFileSync(
          './package.json',
          JSON.stringify(p, null, 2) + '\n'
        );
      "
    - echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > .npmrc
    - npm whoami
    - npm publish
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+/