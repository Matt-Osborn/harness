image: node:22

stages:
  - publish

# --- Build and publish CLI to npm ---
publish-npm:
  stage: publish
  script:
    - npm ci
    - cd packages/harness-cli && npm run bundle
    - node -e "
        const p = require('./packages/harness-cli/package.json');
        delete p.dependencies;
        require('fs').writeFileSync(
          './packages/harness-cli/package.json',
          JSON.stringify(p, null, 2) + '\n'
        );
      "
    - cd packages/harness-cli
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
    - npm publish
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+/